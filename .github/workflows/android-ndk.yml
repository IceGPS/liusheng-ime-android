# .github/workflows/android-ndk.yml
#
# 云端 NDK 构建：编译 MNN arm64 运行时 + JNI bridge，打出带端侧转写的 APK。
#
# 背景：V2 的纯 Kotlin APK（dist/liusheng-ime-android-v2.apk）不含 native 库，
# 真机上 MnnAsrBackend 会降级到局域网。本 workflow 在 GitHub runner 上完成：
#   1. 从源码编译 MNN（arm64-v8a，LLM + audio，CPU only）得到 libMNN.so
#   2. 用 NDK 编译 app/src/main/cpp/mnn_asr_bridge.cpp 得到 libvoiceime_mnn.so
#   3. 按 tools/build-apk-manual.sh 的逻辑（kotlinc+aapt2+d8+apksigner）打 APK，
#      并把 .so 以压缩方式塞进 APK 的 lib/arm64-v8a/（减小体积约 40%）
#   4. 上传 APK + 两个 .so 为 workflow artifacts
#
# 模型文件（~1GB）不进 CI；APK 保持不含模型，仍走 App 内 WiFi 下载流程。
#
# 版本 pin（见 README / models/qwen3-asr-0.6b-int8/EXPORT_NOTES.md）：
#   - MNN_COMMIT：模型导出 + 数值对齐验证时的 master commit，不随意升级
#   - NDK r27：README 指定的版本

name: Android NDK build (sherpa-onnx + APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  MNN_COMMIT: 9c1788748c4d8aba00f9b644f50f5c15576d7d80
  KOTLIN_VERSION: 2.0.20

jobs:
  ndk-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (manual cmdline-tools)
        run: |
          set -euo pipefail
          # android-actions/setup-android@v3 已废弃（会装已下线的 tools 包），改手动装 cmdline-tools
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL --max-time 300 -o /tmp/cmdtools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" \
            "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          "${ANDROID_HOME}/ndk/${NDK_VERSION}/ndk-build" --version | head -2

      - name: Cache APK maven deps
        uses: actions/cache@v4
        with:
          path: .ci-deps
          key: apk-deps-v1

      - name: Download kotlinc
        run: |
          set -euo pipefail
          curl -sSL --max-time 300 -o /tmp/kotlin-compiler.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q /tmp/kotlin-compiler.zip -d "$GITHUB_WORKSPACE"
          echo "KOTLINC_HOME=${GITHUB_WORKSPACE}/kotlinc" >> "$GITHUB_ENV"
          "${GITHUB_WORKSPACE}/kotlinc/bin/kotlinc" -version

      - name: Download sherpa-onnx AAR
        run: |
          set -euo pipefail
          mkdir -p app/libs
          SHERPA_VERSION="1.13.8"
          SHERPA_AAR="app/libs/sherpa-onnx-${SHERPA_VERSION}.aar"
          if [ ! -f "$SHERPA_AAR" ]; then
            echo "Downloading sherpa-onnx AAR v${SHERPA_VERSION}..."
            curl -sSL --max-time 300 -o "$SHERPA_AAR" \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/sherpa-onnx-${SHERPA_VERSION}.aar"
          fi
          ls -lh "$SHERPA_AAR"
          # 解压 AAR：classes.jar 用于编译，jni/*.so 打进 APK
          rm -rf build/sherpa && mkdir -p build/sherpa
          (cd build/sherpa && unzip -o -q "$GITHUB_WORKSPACE/$SHERPA_AAR")
          ls -lh build/sherpa/jni/arm64-v8a/

      - name: Generate BuildInfo.kt (version + git sha + build time)
        run: |
          set -euo pipefail
          PROJ_DIR="$GITHUB_WORKSPACE"
          # 从 app/build.gradle.kts 解析 versionCode/versionName（唯一真相源）
          VERSION_CODE=$(grep -m1 "versionCode = " "$PROJ_DIR/app/build.gradle.kts" | grep -oE "[0-9]+")
          VERSION_NAME=$(grep -m1 'versionName = ' "$PROJ_DIR/app/build.gradle.kts" | grep -oE '"[^"]+"' | tr -d '"')
          GIT_SHA_SHORT="${GITHUB_SHA:0:7}"
          BUILD_DATE_UTC=$(date -u "+%Y-%m-%d %H:%M UTC")
          echo "VERSION_CODE=$VERSION_CODE VERSION_NAME=$VERSION_NAME GIT_SHA=$GIT_SHA_SHORT BUILD_DATE=$BUILD_DATE_UTC"
          cat > "$PROJ_DIR/app/src/main/java/com/icegps/voiceime/util/BuildInfo.kt" <<EOF
          package com.icegps.voiceime.util

          /** CI 自动生成，请勿手改 */
          object BuildInfo {
              const val VERSION_NAME = "$VERSION_NAME"
              const val VERSION_CODE = $VERSION_CODE
              const val BUILD_DATE = "$BUILD_DATE_UTC"
              const val GIT_SHA = "$GIT_SHA_SHORT"
          }
          EOF
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build APK (manual pipeline + native libs)
        run: |
          set -euo pipefail
          PROJ_DIR="$GITHUB_WORKSPACE"
          BUILD_DIR="$(mktemp -d)"
          trap 'rm -rf "$BUILD_DIR"' EXIT

          BT="$ANDROID_HOME/build-tools/34.0.0"
          PLATFORM="$ANDROID_HOME/platforms/android-34/android.jar"
          APP_ID="com.icegps.voiceime"
          VERSION_CODE="${VERSION_CODE:?}"
          VERSION_NAME="${VERSION_NAME:?}"

          export PATH="$JAVA_HOME/bin:$BT:$PATH"

          echo "== 下载依赖（okhttp/okio/kotlin-stdlib）"
          DEPS_DIR="$PROJ_DIR/.ci-deps"
          mkdir -p "$DEPS_DIR"
          for art in \
            "org/jetbrains/kotlin/kotlin-stdlib/2.0.20/kotlin-stdlib-2.0.20.jar" \
            "com/squareup/okhttp3/okhttp/4.12.0/okhttp-4.12.0.jar" \
            "com/squareup/okio/okio-jvm/3.6.0/okio-jvm-3.6.0.jar" \
            "org/jetbrains/annotations/13.0/annotations-13.0.jar" ; do
            f="$DEPS_DIR/$(basename "$art")"
            [ -f "$f" ] || curl -sSL --max-time 120 -o "$f" "https://repo.maven.apache.org/maven2/$art"
          done
          CP_DEPS="$DEPS_DIR/kotlin-stdlib-2.0.20.jar:$DEPS_DIR/okhttp-4.12.0.jar:$DEPS_DIR/okio-jvm-3.6.0.jar:$DEPS_DIR/annotations-13.0.jar"

          echo "== 准备 native libs（sherpa-onnx AAR 的 .so）"
          STAGE="$BUILD_DIR/native"
          mkdir -p "$STAGE/lib/arm64-v8a"
          cp "$PROJ_DIR/build/sherpa/jni/arm64-v8a/"*.so "$STAGE/lib/arm64-v8a/"
          ls -lh "$STAGE/lib/arm64-v8a/"
          # sherpa-onnx classes.jar 加入编译 classpath
          SHERPA_JAR="$PROJ_DIR/build/sherpa/classes.jar"
          CP_DEPS="$CP_DEPS:$SHERPA_JAR"

          echo "== aapt2 compile/link（资源 + R.java + base.apk）"
          mkdir -p "$BUILD_DIR/compiled-res" "$BUILD_DIR/gen"
          "$BT/aapt2" compile --dir "$PROJ_DIR/app/src/main/res" -o "$BUILD_DIR/compiled-res/"
          sed 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="'"$APP_ID"'">|' \
            "$PROJ_DIR/app/src/main/AndroidManifest.xml" > "$BUILD_DIR/AndroidManifest.xml"
          "$BT/aapt2" link -o "$BUILD_DIR/base.apk" \
            --java "$BUILD_DIR/gen" \
            --manifest "$BUILD_DIR/AndroidManifest.xml" \
            --min-sdk-version 26 --target-sdk-version 35 \
            --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" \
            -A "$PROJ_DIR/app/src/main/assets" \
            -I "$PLATFORM" "$BUILD_DIR"/compiled-res/*.flat

          echo "== kotlinc（全部 Kotlin 源码 + R.java）"
          mkdir -p "$BUILD_DIR/classes"
          "$KOTLINC_HOME/bin/kotlinc" -jvm-target 17 -no-reflect \
            -cp "$PLATFORM:$CP_DEPS" \
            -d "$BUILD_DIR/classes" \
            $(find "$PROJ_DIR/app/src/main/java" -name "*.kt") \
            "$BUILD_DIR/gen/com/icegps/voiceime/R.java"

          echo "== d8（dex）"
          mkdir -p "$BUILD_DIR/dex"
          (cd "$BUILD_DIR/classes" && "$JAVA_HOME/bin/jar" cf "$BUILD_DIR/app-classes.jar" .)
          "$JAVA_HOME/bin/java" -cp "$BT/lib/d8.jar" com.android.tools.r8.D8 \
            --min-api 26 --lib "$PLATFORM" --output "$BUILD_DIR/dex/" \
            "$BUILD_DIR/app-classes.jar" \
            "$DEPS_DIR/kotlin-stdlib-2.0.20.jar" "$DEPS_DIR/okhttp-4.12.0.jar" "$DEPS_DIR/okio-jvm-3.6.0.jar" \
            "$SHERPA_JAR"

          echo "== 打包：classes.dex + native libs（.so 压缩存放，减小体积）"
          cp "$BUILD_DIR/dex/classes.dex" "$BUILD_DIR/"
          (cd "$BUILD_DIR" && "$BT/aapt" add base.apk classes.dex > /dev/null)
          (cd "$STAGE" && zip -9 -q -r "$BUILD_DIR/base.apk" lib)

          echo "== 对齐/签名/校验"
          "$BT/zipalign" -f 4 "$BUILD_DIR/base.apk" "$BUILD_DIR/aligned.apk"
          # 用固定 keystore（GitHub secret KEYSTORE_B64），保证每次签名一致，可覆盖安装
          KEYSTORE="$BUILD_DIR/debug.keystore"
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$KEYSTORE"
          "$JAVA_HOME/bin/java" -jar "$BT/lib/apksigner.jar" sign \
            --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android \
            --out "$BUILD_DIR/signed.apk" "$BUILD_DIR/aligned.apk"
          "$JAVA_HOME/bin/java" -jar "$BT/lib/apksigner.jar" verify "$BUILD_DIR/signed.apk"

          echo "== 输出产物"
          mkdir -p "$PROJ_DIR/dist" "$PROJ_DIR/dist/native-libs/arm64-v8a"
          cp "$BUILD_DIR/signed.apk" "$PROJ_DIR/dist/liusheng-ime-android-v2.apk"
          cp "$STAGE/lib/arm64-v8a/"*.so "$PROJ_DIR/dist/native-libs/arm64-v8a/"
          "$BT/aapt" dump badging "$PROJ_DIR/dist/liusheng-ime-android-v2.apk" | head -2
          unzip -l "$PROJ_DIR/dist/liusheng-ime-android-v2.apk" | grep -E "lib/arm64|classes.dex"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liusheng-ime-android-v2-ndk
          path: |
            dist/liusheng-ime-android-v2.apk
            dist/native-libs/arm64-v8a/*.so
          if-no-files-found: error
